<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realistic Traffic Signal + Moore System</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Arial, sans-serif;
    background: url('image.jpg') no-repeat center center fixed;
    background-size: cover;
}

/* ---------- HEADING ---------- */
h1{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    font-size:32px;
    color:#fff;
    text-shadow: 2px 2px 8px black;
    animation: glow 2s ease-in-out infinite alternate;
    z-index:10;
}

@keyframes glow{
    from { text-shadow: 2px 2px 8px black, 0 0 10px #fff; }
    to { text-shadow: 2px 2px 8px black, 0 0 25px #ff0; }
}

/* ---------- ROAD ---------- */
.road{
    position:absolute;
    top:50%;
    left:0;
    transform:translateY(-50%);
    width:100%;
    height:260px;
    background:#000;
}

.lane1, .lane2{
    position:absolute;
    width:100%;
    height:120px;
    background:transparent;
    border-top:6px solid #555;
    border-bottom:6px solid #555;
    overflow:hidden;
}

.lane1{ top:0; }
.lane2{ bottom:0; }

.dashes{
    position:absolute;
    top:50%;
    width:200%;
    height:6px;
    transform:translateY(-50%);
    background:repeating-linear-gradient(
        to right,
        yellow 0 50px,
        transparent 50px 100px
    );
}

/* CARS */
.car{
    position:absolute;
    width:80px;
    height:40px;
    border-radius:8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    transition: all 0.3s ease-in-out;
}

.car::before{
    content:"";
    width:14px;
    height:14px;
    background:black;
    border-radius:50%;
    position:absolute;
    bottom:-7px;
    left:10px;
    box-shadow:45px 0 black;
}

@keyframes driveRight {
    from { left:-120px; }
    to   { left:110%; }
}
@keyframes driveLeft {
    from { left:110%; }
    to   { left:-150px; }
}

/* TRAFFIC SIGNAL */
.trafficPole {
    position:absolute;
    bottom:0;
    right:70px;
    width:20px;
    height:300px;
    background: linear-gradient(#444, #111);
    border-radius:5px;
    z-index:5;
}

.signalBox{
    position:absolute;
    top:20px;
    right:20px;
    width:120px;
    padding:15px;
    background: #222;
    border-radius:20px;
    color:white;
    z-index:10;
}

.light{
    width:50px;
    height:50px;
    border-radius:50%;
    margin:12px auto;
    background:#333;
    transition: 0.6s;
}

.red.on{
    background:red;
    box-shadow: 0 0 25px red;
}
.green.on{
    background:lime;
    box-shadow: 0 0 25px lime;
}
.yellow.on{
    background:yellow;
    box-shadow: 0 0 25px yellow;
}

/* STATE NAME */
#stateName{
    text-align:center;
    font-weight:bold;
    margin-top:10px;
    font-size:18px;
    color:#fff;
}
</style>
</head>
<body>

<h1>TRAFFIC CONTROL SYSTEM</h1>

<div class="trafficPole"></div>

<div class="road">
    <div class="lane1">
        <div class="dashes"></div>
        <div class="car" style="background:red;"></div>
        <div class="car" style="background:yellow;"></div>
        <div class="car" style="background:cyan;"></div>
        <div class="car" style="background:pink;"></div>
    </div>

    <div class="lane2">
        <div class="dashes"></div>
        <div id="carA" class="car" style="background:blue;"></div>
        <div id="carB" class="car" style="background:orange;"></div>
        <div id="carC" class="car" style="background:green;"></div>
        <div id="carD" class="car" style="background:brown;"></div>
    </div>
</div>

<div class="signalBox">
    <div id="redLight" class="light red"></div>
    <div id="yellowLight" class="light yellow"></div>
    <div id="greenLight" class="light green"></div>
    <div id="stateName">State: S0 (RED)</div>
    <div style="text-align:center;">Timer: <span id="timer">20</span></div>
</div>

<script>
let state = 0;

// RED → YELLOW → GREEN
let durations = [20, 5, 25];
let timeLeft = durations[state];

const redLight = document.getElementById("redLight");
const yellowLight = document.getElementById("yellowLight");
const greenLight = document.getElementById("greenLight");
const stateName = document.getElementById("stateName");
const timer = document.getElementById("timer");

const carsBottom = [
    document.getElementById("carA"),
    document.getElementById("carB"),
    document.getElementById("carC"),
    document.getElementById("carD")
];

const carsTop = document.querySelectorAll(".lane1 .car");

function setLights(){
    redLight.classList.remove("on");
    yellowLight.classList.remove("on");
    greenLight.classList.remove("on");

    if(state === 0){               // RED
        redLight.classList.add("on");
        stateName.innerText = "State: S0 (RED)";
        stopCars();
    }
    else if(state === 1){          // YELLOW
        yellowLight.classList.add("on");
        stateName.innerText = "State: S1 (YELLOW)";
        readyCars();
    }
    else if(state === 2){          // GREEN
        greenLight.classList.add("on");
        stateName.innerText = "State: S2 (GREEN)";
        moveCars();
    }
}

function moveCars(){
    carsBottom.forEach((car,i)=>{
        car.style.animation = `driveRight ${6+i*1.3}s linear infinite`;
    });
    carsTop.forEach((car,i)=>{
        car.style.animation = `driveLeft ${6+i*1.3}s linear infinite`;
    });
}

/* ---------- SHOW ALL CARS ON STOP STATE ---------- */
function stopCars(){
    carsBottom.forEach((car,i)=>{
        car.style.animation = "none";
        car.style.left = (i * 110) + "px";
        car.style.top = "40px";
    });
    carsTop.forEach((car,i)=>{
        car.style.animation = "none";
        car.style.left = (i * 110) + "px";
        car.style.top = "40px";
    });
}

/* ---------- SHOW ALL CARS ON READY STATE ---------- */
function readyCars(){
    carsBottom.forEach((car,i)=>{
        car.style.animation = "none";
        car.style.left = (i * 90) + "px";
        car.style.top = "40px";
    });
    carsTop.forEach((car,i)=>{
        car.style.animation = "none";
        car.style.left = (i * 90) + "px";
        car.style.top = "40px";
    });
}

setLights();
timer.innerText = timeLeft;

setInterval(()=>{
    timeLeft--;
    timer.innerText = timeLeft;

    if(timeLeft <= 0){
        state = (state + 1) % 3;
        timeLeft = durations[state];
        setLights();
    }
},1000);
</script>

</body>
</html>
